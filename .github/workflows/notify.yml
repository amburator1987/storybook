name: Storybook Component Change Notifier

# Pokreće se nakon što Release workflow završi — tako je novi tag već kreiran
# i možemo ga pouzdano pročitati. head_sha = originalni push commit (prije
# semantic-release chore commita), pa git diff HEAD~1 HEAD daje pravi diff koda.
on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    # Notifikacija se šalje i kad nema nove verzije (neutral commits)
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2          # HEAD i HEAD~1 za diff originalnog commita

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Get latest version tag
        id: version
        run: |
          TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "tag=${TAG:-bez verzije}" >> "$GITHUB_OUTPUT"

      - name: Analyze changes and notify team
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, urllib.request

          def git(*args):
              return subprocess.check_output(['git'] + list(args), text=True).strip()

          # --- Commit info (originalni push commit = HEAD ovdje) ---
          commit_msg = git('log', '-1', '--pretty=%s')
          commit_sha = git('log', '-1', '--pretty=%h')
          commit_url = git('log', '-1', '--pretty=%H')
          author     = git('log', '-1', '--pretty=%an')
          repo_url   = git('remote', 'get-url', 'origin').replace('.git', '')
          diff       = git('diff', 'HEAD~1', 'HEAD')[:12000]
          version    = os.environ.get('RELEASE_VERSION', 'bez verzije')

          # --- Conventional commits → tip izmjene ---
          TYPES = {
              'feat':     '🆕 Nova funkcionalnost',
              'fix':      '🐛 Ispravka buga',
              'refactor': '♻️ Refaktorisanje',
              'docs':     '📝 Dokumentacija',
              'style':    '💅 Stilske izmjene',
              'chore':    '🔧 Održavanje',
              'test':     '🧪 Testovi',
              'perf':     '⚡ Performanse',
              'ci':       '⚙️ CI/CD',
          }
          commit_type = next(
              (label for prefix, label in TYPES.items()
               if commit_msg.lower().startswith(f'{prefix}:')),
              '📦 Izmjena'
          )

          # --- Claude API: opis izmjena ---
          if diff.strip():
              prompt = (
                  "Analiziraj ovaj git diff Vue 3 Storybook component library projekta (Kaizen design system).\n"
                  "Opiši u 2-4 kratke rečenice za tim:\n"
                  "- koje Storybook komponente su izmijenjene (iz putanja src/components/)\n"
                  "- šta je konkretno promijenjeno (props, CSS tokeni, stilovi, stories, template logika)\n"
                  "- kakav je uticaj na design system\n"
                  "Odgovori na bosanskom jeziku. Budi koncizan. Ne koristi markdown formatiranje.\n\n"
                  f"Git diff:\n{diff}"
              )
              payload = {
                  "model": "claude-sonnet-4-20250514",
                  "max_tokens": 512,
                  "messages": [{"role": "user", "content": prompt}],
              }
              req = urllib.request.Request(
                  'https://api.anthropic.com/v1/messages',
                  data=json.dumps(payload).encode(),
                  headers={
                      'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                      'anthropic-version': '2023-06-01',
                      'content-type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read())
                  description = data['content'][0]['text']
              except Exception as e:
                  description = f"Greška pri analizi diff-a: {e}"
          else:
              description = "Nema izmjena u izvornom kodu."

          # --- Google Chat poruka ---
          commit_link = f"{repo_url}/commit/{commit_url}"
          version_line = f"*Verzija:* `{version}`\n" if version != 'bez verzije' else ''
          message = (
              f"*{commit_type}*\n"
              f"*Commit:* <{commit_link}|`{commit_sha}`> — {commit_msg}\n"
              f"*Autor:* {author}\n"
              f"{version_line}"
              f"\n{description}"
          )

          gchat_payload = {"text": message}
          req2 = urllib.request.Request(
              os.environ['GOOGLE_CHAT_WEBHOOK_URL'],
              data=json.dumps(gchat_payload).encode(),
              headers={'content-type': 'application/json'},
          )
          try:
              urllib.request.urlopen(req2, timeout=10)
              print(f"✅ Notifikacija poslana u Google Chat ({version}).")
          except Exception as e:
              print(f"❌ Greška pri slanju u Google Chat: {e}")
              raise SystemExit(1)
          PYEOF
