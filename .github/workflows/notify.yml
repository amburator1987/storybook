name: Storybook Component Change Notifier

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Get latest version tag
        id: version
        run: |
          TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "tag=${TAG:-bez verzije}" >> "$GITHUB_OUTPUT"

      - name: Analyze changes and notify team
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, urllib.request

          def git(*args):
              return subprocess.check_output(['git'] + list(args), text=True).strip()

          head_sha = os.environ.get('HEAD_SHA', 'HEAD')

          # --- Commit info ---
          commit_msg = git('log', '-1', '--pretty=%s', head_sha)
          commit_sha = git('log', '-1', '--pretty=%h', head_sha)
          commit_url = git('log', '-1', '--pretty=%H', head_sha)
          author     = git('log', '-1', '--pretty=%an', head_sha)
          repo_url   = git('remote', 'get-url', 'origin').replace('.git', '')
          diff       = git('diff', f'{head_sha}~1', head_sha)[:12000]
          version    = os.environ.get('RELEASE_VERSION', 'bez verzije')

          # --- Conventional commits → tip izmjene ---
          TYPES = {
              'feat':     '🆕 Nova funkcionalnost',
              'fix':      '🐛 Ispravka buga',
              'refactor': '♻️ Refaktorisanje',
              'docs':     '📝 Dokumentacija',
              'style':    '💅 Stilske izmjene',
              'chore':    '🔧 Održavanje',
              'test':     '🧪 Testovi',
              'perf':     '⚡ Performanse',
              'ci':       '⚙️ CI/CD',
          }
          commit_type = next(
              (label for prefix, label in TYPES.items()
               if commit_msg.lower().startswith(f'{prefix}:')),
              '📦 Izmjena'
          )

          # --- Claude API: opis izmjena ---
          if diff.strip():
              prompt = (
                    "Analiziraj ovaj git diff Vue 3 Storybook component library projekta (Kaizen design system).\n"
                    "Vrati odgovor TAČNO u ovom formatu, bez dodatnog teksta:\n\n"
                    "Kratak opis: [1-2 rečenice šta je generalno urađeno]\n\n"
                    "---\n\n"
                    "[Za svaku izmijenjenu komponentu iz src/components/ napravi sekciju]:\n"
                    "ComponentName\n"
                    "- [bullet šta je konkretno izmijenjeno: props, CSS tokeni, stilovi, stories, template]\n"
                    "- [još bullet ako ima]\n\n"
                    "Odgovori na bosanskom jeziku. Ne koristi markdown formatiranje osim crtica za bullet points.\n\n"
                    f"Git diff:\n{diff}"
              )
              payload = {
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 512,
                  "messages": [{"role": "user", "content": prompt}],
              }
              req = urllib.request.Request(
                  'https://api.anthropic.com/v1/messages',
                  data=json.dumps(payload).encode(),
                  headers={
                      'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                      'anthropic-version': '2023-06-01',
                      'content-type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read())
                  description = data['content'][0]['text']
              except Exception as e:
                  description = f"Greška pri analizi diff-a: {e}"
          else:
              description = "Nema izmjena u izvornom kodu."

          # --- Google Chat poruka ---
          commit_link = f"{repo_url}/commit/{commit_url}"
          version_line = f"*Verzija:* `{version}`\n" if version != 'bez verzije' else ''
          message = (
                f"*{commit_type}*\n"
                f"*Commit:* <{commit_link}|`{commit_sha}`> — {commit_msg}\n"
                f"*Autor:* {author}\n"
                f"{version_line}"
                f"\n─────────────────────\n"
                f"{description}"
          )

          gchat_payload = {"text": message}
          req2 = urllib.request.Request(
              os.environ['GOOGLE_CHAT_WEBHOOK_URL'],
              data=json.dumps(gchat_payload).encode(),
              headers={'content-type': 'application/json'},
          )
          try:
              urllib.request.urlopen(req2, timeout=10)
              print(f"✅ Notifikacija poslana u Google Chat ({version}).")
          except Exception as e:
              print(f"❌ Greška pri slanju u Google Chat: {e}")
              raise SystemExit(1)
          PYEOF